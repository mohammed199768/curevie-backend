upstream curevie_backend {
    server backend:5000;
    keepalive 32;
}

# Only switch to "upgrade" for real WebSocket handshakes so normal requests keep the keepalive pool.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name api.curevie.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.curevie.net;

    ssl_certificate /etc/letsencrypt/live/api.curevie.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.curevie.net/privkey.pem;

    # nginx is the edge: the client address it sees is the only trustworthy one.
    # X-Forwarded-For is overwritten (not appended) so clients cannot inject fake IPs.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Password guessing endpoints get the strict per-IP zone.
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://curevie_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://curevie_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Socket.io (chat, live case updates, notification counters).
    location /socket.io/ {
        proxy_pass http://curevie_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/health {
        proxy_pass http://curevie_backend;
        access_log off;
    }

    location / {
        return 444;
    }
}
